version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-store
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: agentic-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/workspace
    depends_on:
      - qdrant
    restart: always

volumes:
  qdrant_data:
